[output]
pretty_json = true
include_nulls = false
ndjson = false

[scrape]
page_title = true
canonical_url = true
meta_tags = true
cover_image = true

post_id = true
categories = true
wp_tags = true

entry_title = true
entry_datetime = true
author = true
comments_count = true

release_number = true
game_title_line = true
genres_tags = true
companies = true
languages = true
original_size = true
repack_size = true

spoiler_sections = true
download_section_presence = true
torrent_file = true
torrent_file_name = true
torrent_file_link = true
magnet = true

[links]
domain_counts = true
ignore_magnet = false

[profile]
wordpress_release_layout = true
spoiler_denylist = ["click to show direct links", "direct links", "magnet", "torrent"]

[meilisearch]
host = "http://127.0.0.1:7700"
api_key = ""
index_uid = "fitgirl-games"
primary_key = "id"
batch_size = 1000
timeout_secs = 120
mode = "upsert"
apply_settings_on_existing = false

[meilisearch.settings]
displayed_attributes = [
  "poster",
  "title",
  "site",
  "source_path",
  "canonical_url",
  "categories",
  "wp_tags",
  "genres",
  "companies",
  "languages_raw",
  "original_size_raw",
  "repack_size_raw",
  "release_number",
  "entry_datetime",
  "author",
  "torrent_file",
]
searchable_attributes = ["title", "categories", "wp_tags", "genres", "companies", "languages_raw"]
filterable_attributes = ["categories", "wp_tags", "genres", "companies", "languages_raw"]
sortable_attributes = ["release_number", "entry_datetime"]
